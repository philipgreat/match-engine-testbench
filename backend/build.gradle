plugins {
    id 'java'
    id 'eclipse'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'maven-publish'
}


group = 'com.philipgreat'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'


repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
    maven{
        url = uri("https://nexus.teaql.io/repository/maven-releases/")
    }
    mavenCentral()
}
//targetlib="com.yourcompany:logservice-core:"+libversion
println "The project is using com.philipgreat:testbench-service-core:"+libversion

bootJar {
    destinationDirectory = file('target/deploy')
    // If you need to include 'org.springframework.cloud:spring-cloud-function-adapter-gcp' specifically for the bootJar
    // It's typically managed by declaring it in the dependencies block
}

dependencies {
    implementation 'com.zaxxer:HikariCP'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc:6.1.0'

    implementation "com.doublechaintech:supplier-relation-service-core:$libversion"
    //implementation 'org.beanshell:bsh:2.0b5'
    //implementation 'org.postgresql:postgresql'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
//    implementation 'org.redisson:redisson-spring-boot-starter:3.16.1'
//    implementation 'org.redisson:redisson:3.31.0'

}

